services:
  neo4j:
    restart: unless-stopped
    image: neo4j:2026.08.1-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-kotoba-development-only}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - ${KOTOBA_DATA_DIR:-./data/docker/development}/neo4j:/data
      - ${KOTOBA_DATA_DIR:-./data/docker/development}/neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kotoba-development-only}
      KOTOBA_ICHIRAN_URL: ${KOTOBA_ICHIRAN_URL:-http://host.docker.internal:${KOTOBA_ICHIRAN_PORT:-8091}}
      KOTOBA_MEDIA_DIR: /data/media
      KOTOBA_WORKER_TOKEN: ${KOTOBA_WORKER_TOKEN:?worker token required}
    volumes:
      - ${KOTOBA_DATA_DIR:-./data/docker/development}/media:/data/media
    depends_on:
      neo4j:
        condition: service_healthy
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:${KOTOBA_PORT:-3010}:80"
    depends_on:
      - api
